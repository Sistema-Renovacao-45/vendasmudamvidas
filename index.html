<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas Mudam Vidas | Em Breve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            /* Padrão de Colmeia em CSS Puro */
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='69.28203230275509' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 11.547L40 34.641L20 46.188L0 34.641L0 11.547L20 0L40 11.547ZM20 69.282L0 57.735L0 34.641L20 46.188L40 34.641L40 57.735L20 69.282Z' fill='%2310b981' fill-opacity='0.04' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        
        /* Animação do Letreiro Contínuo */
        .animate-marquee {
            display: inline-block;
            animation: marquee 20s linear infinite;
        }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Forma do Cristal/Hexágono */
        .crystal-shape {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-emerald-500 selection:text-zinc-900">
    
    <!-- Brilho de Fundo (Aura) -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-600 rounded-full blur-[150px] opacity-20 pointer-events-none z-0"></div>

    <!-- Conteúdo Principal -->
    <main class="z-10 flex flex-col items-center text-center px-6 max-w-4xl w-full mt-[-80px]">
        
        <!-- O Arquétipo do Cristal/Colmeia -->
        <div class="relative w-28 h-28 mb-12 flex justify-center items-center">
            <div class="absolute inset-0 bg-emerald-500 blur-2xl opacity-40 animate-pulse"></div>
            <div class="relative w-20 h-24 bg-gradient-to-br from-emerald-400 to-emerald-900 crystal-shape shadow-[0_0_40px_rgba(16,185,129,0.8)] border border-emerald-300"></div>
        </div>

        <!-- Título de Impacto -->
        <h1 class="text-5xl md:text-7xl font-black tracking-tight mb-6 leading-tight">
            Menos barulho, <br class="hidden md:block" />
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-emerald-600">mais clareza.</span>
        </h1>

        <!-- Subtítulo -->
        <p class="text-lg md:text-2xl text-zinc-400 max-w-2xl font-light">
            O guia definitivo para entender o digital antes de dar o primeiro passo.
        </p>
    </main>

    <!-- Fita Animada (Ticker) -->
    <div class="absolute bottom-16 md:bottom-24 left-0 w-full bg-emerald-500 py-3 shadow-[0_0_40px_rgba(16,185,129,0.4)] rotate-[-3deg] scale-110 z-20 border-y-2 border-emerald-900">
        <div class="whitespace-nowrap animate-marquee text-zinc-950 font-black text-xl md:text-2xl tracking-[0.25em] uppercase flex items-center">
            <!-- Sequência Original -->
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-sm">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-sm">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-sm">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-sm">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-sm">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-sm">✦</span></span>
            <!-- Duplicado para fluidez do loop -->
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-sm">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-sm">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-sm">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-sm">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-sm">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-sm">✦</span></span>
        </div>
    </div>

</body>
</html>
