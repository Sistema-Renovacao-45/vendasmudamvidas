<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas Mudam Vidas | Em Breve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #050505; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        
        /* Fita Animada */
        .animate-marquee { 
            display: inline-block; 
            animation: marquee 20s linear infinite; 
        }
        @keyframes marquee { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-50%); } 
        }

        /* Animação da Linha Verde (Cortina Cinematográfica) */
        .curtain-top, .curtain-bottom {
            position: fixed;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #000;
            z-index: 100;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .curtain-top {
            top: 0;
            border-bottom: 2px solid #10b981;
            box-shadow: 0 10px 40px rgba(16,185,129,0.5);
        }
        .curtain-bottom {
            bottom: 0;
            border-top: 2px solid #10b981;
            box-shadow: 0 -10px 40px rgba(16,185,129,0.5);
        }

        /* Classes ativadas pelo JavaScript para abrir a tela */
        .open-curtain .curtain-top {
            transform: translateY(-100%);
        }
        .open-curtain .curtain-bottom {
            transform: translateY(100%);
        }

        /* Aura Neon Pulsante (Substitui o vídeo de fundo) */
        .neon-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw; 
            height: 150vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(16,185,129,0.3) 0%, rgba(16,185,129,0.05) 40%, transparent 70%);
            animation: pulse-aura 4s ease-in-out infinite alternate;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes pulse-aura {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Revelação suave do conteúdo */
        .content-reveal {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            transition-delay: 0.3s;
        }
        .open-curtain .content-reveal {
            opacity: 1;
            transform: scale(1);
        }

        /* Ajuste fino da imagem do letreiro */
        .vmv-image {
            width: 100%;
            max-width: 500px;
            height: auto;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.9)); /* Cria sombra para destacar no verde */
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center relative selection:bg-emerald-500 selection:text-zinc-900">
    
    <!-- Animação de Abertura (As linhas que se dividem) -->
    <div class="curtain-top"></div>
    <div class="curtain-bottom"></div>

    <!-- O Gradiente Neon em CSS -->
    <div class="neon-aura"></div>

    <!-- Conteúdo Principal -->
    <main class="content-reveal z-20 flex flex-col items-center text-center px-6 max-w-4xl w-full relative mt-[-20px]">
        
        <!-- A IMAGEM ESTÁTICA ENTRA AQUI -->
        <img src="vmv-img.png" alt="VMV" class="vmv-image mb-4">

        <h1 class="text-4xl md:text-7xl uppercase font-black leading-[0.95] tracking-tighter mb-4 drop-shadow-[0_10px_20px_rgba(0,0,0,1)] z-10">
            Menos barulho, <br class="hidden md:block" />
            <span class="text-emerald-400">mais clareza.</span>
        </h1>
        <p class="text-base md:text-2xl text-zinc-300 max-w-xl text-center leading-relaxed font-light mb-12 drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] z-10 relative">
            O guia definitivo para entender o digital antes de dar o primeiro passo.
        </p>
    </main>

    <!-- Fita Animada -->
    <div class="content-reveal absolute bottom-12 md:bottom-20 left-[-5%] w-[110%] bg-emerald-500 py-[14px] md:py-[18px] shadow-[0_10px_40px_rgba(0,0,0,0.8)] rotate-[-2deg] z-30 border-y-[3px] border-emerald-900">
        <div class="whitespace-nowrap animate-marquee text-zinc-950 font-black text-xl md:text-[26px] tracking-[0.2em] uppercase flex items-center">
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
        </div>
    </div>

    <!-- Script que aciona a abertura -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Segura a tela preta com a linha verde por 1 segundo e depois abre
            setTimeout(() => {
                document.body.classList.add('open-curtain');
            }, 1000);
        });
    </script>
</body>
</html>
