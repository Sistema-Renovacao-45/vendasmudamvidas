<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vendas Mudam Vidas | Em Breve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base travada para não bugar no mobile */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Textura de Tecido (Chumbo) */
        .bg-texture {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
            opacity: 0.4;
            z-index: 1;
            pointer-events: none;
        }
        
        /* Aura Neon Pulsante */
        .neon-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120vw;
            height: 120vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, rgba(16,185,129,0.02) 50%, transparent 70%);
            animation: pulse-glow 4s ease-in-out infinite alternate;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Cortinas de Abertura Cinematográfica */
        .curtain-top, .curtain-bottom {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #050505;
            z-index: 9999;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .curtain-top { top: 0; border-bottom: 2px solid #10b981; }
        .curtain-bottom { bottom: 0; border-top: 2px solid #10b981; }
        
        body.loaded .curtain-top { transform: translateY(-100%); }
        body.loaded .curtain-bottom { transform: translateY(100%); }

        /* Animação de Revelação Suave */
        .reveal-item {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            transition-delay: 0.3s;
        }
        body.loaded .reveal-item {
            opacity: 1;
            transform: scale(1);
        }

        /* Fita Animada */
        .marquee-container {
            display: flex;
            width: max-content;
            animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <!-- Abertura -->
    <div class="curtain-top"></div>
    <div class="curtain-bottom"></div>

    <!-- Fundo Limpo -->
    <div class="bg-texture"></div>
    <div class="neon-glow"></div>

    <!-- Conteúdo 100% Centralizado -->
    <main class="relative z-10 flex flex-col items-center justify-center w-full h-full px-6 text-center reveal-item">
        <!-- Ajuste fino de margem negativa para compensar o espaço visual da fita no rodapé -->
        <div class="mt-[-10vh]">
            <h1 class="text-[2.2rem] md:text-7xl uppercase font-black leading-[1.05] md:leading-[0.95] tracking-tighter mb-4 drop-shadow-[0_10px_20px_rgba(0,0,0,1)] text-white">
                Menos barulho, <br>
                <span class="text-emerald-400">mais clareza.</span>
            </h1>
            <p class="text-base md:text-2xl text-zinc-300 max-w-xl mx-auto leading-relaxed font-light drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)]">
                O guia definitivo para entender o digital antes de dar o primeiro passo.
            </p>
        </div>
    </main>

    <!-- Fita Animada (Isolada no rodapé) -->
    <div class="reveal-item absolute bottom-8 md:bottom-12 left-[-10%] w-[120%] bg-emerald-500 py-3 md:py-4 shadow-[0_10px_40px_rgba(0,0,0,0.9)] rotate-[-2deg] z-20 border-y-[3px] border-emerald-900">
        <div class="marquee-container text-zinc-950 font-black text-xl md:text-[26px] tracking-[0.2em] uppercase items-center">
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
            <span class="px-6 flex items-center">EM BREVE <span class="mx-6 text-lg text-emerald-950">✦</span> VENDAS MUDAM VIDAS <span class="mx-6 text-lg text-emerald-950">✦</span></span>
        </div>
    </div>

    <!-- Gatilho da Animação -->
    <script>
        window.onload = () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 800); 
        };
    </script>
</body>
</html>
